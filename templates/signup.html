{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 | HUFS Roommate Matching</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Pretendard", sans-serif;
    }

    body {
      height: 100vh;
      background: url("{% static 'images/background.png' %}") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-wrapper {
      background: rgba(255, 255, 255, 0.94);
      padding: 2rem;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 420px;
    }

    .form-wrapper h2 {
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
      color: #222;
    }

    label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: #333;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #7a5ef7;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color: #7a5ef7;
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(122, 94, 247, 0.4);
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #6244e7;
    }

    .login-redirect {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.9rem;
      color: #444;
    }

    .login-redirect a {
      color: #6d4dff;
      text-decoration: none;
      font-weight: bold;
    }

    .login-redirect a:hover {
      text-decoration: underline;
    }

    input.error {
       margin-bottom: 6px;   /* 필요하면 2~8px로 조절 */
    }
    .error-message {
      margin-top: 1px;
      margin-bottom: 8px;
      color: red;
      font-size: 0.9rem;
   }
    
    .error-message { 
      transition: opacity .35s ease; /* 부드럽게 사라짐 */
    }
    .error-message.fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="form-wrapper">
    <h2>회원가입</h2>

    {% if error %}
      <p style="color: red; text-align: center; margin-bottom: 0.5rem;">{{ error }}</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <input type="text" style="display:none" autocomplete="username">
      <input type="password" style="display:none" autocomplete="new-password">

      <label for="name">이름</label>
      <input type="text" name="name" 
             class="{% if name_error %}error{% endif %}"
             required autocomplete="off" autocapitalize="off" spellcheck="false"
             value="{{ name|default:'' }}">
        {% if name_error %}
            <p class="error-message">{{ name_error }}</p>
        {% endif %}

      <label for="studentId">학번</label>
        <input type="text" name="studentId"
               class="{% if id_error %}error{% endif %}"
               required autocomplete="off" autocapitalize="off" spellcheck="false"
               inputmode="numeric" pattern="[0-9]*"
               value="{{ studentId|default:'' }}">
        {% if id_error %}
          <p class="error-message">{{ id_error }}</p>
        {% endif %}

        <label for="password">비밀번호</label>
        <input type="password" name="password" required autocomplete="new-password">

        <label for="password2">비밀번호 확인</label>
        <input type="password" name="password2"
               class="{% if pw_error %}error{% endif %}"
               required autocomplete="new-password">
        {% if pw_error %}
          <p class="error-message pw-error">{{ pw_error }}</p>
        {% endif %}

      <button type="submit">계정 생성</button>
    </form>

    <div class="login-redirect">
      이미 계정이 있으신가요? <a href="{% url 'login' %}">로그인</a>
    </div>
  </div>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    // 페이지에 있는 모든 에러 메시지를 4.5초 후 사라지게
    document.querySelectorAll('.error-message').forEach(el => {
      setTimeout(() => {
        el.classList.add('fade-out');    
        setTimeout(() => el.remove(), 400); 
      }, 4500);
    });
  });
</script>
</body>
</html>
